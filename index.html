<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Aluguel · Projetar</title>
<style>
  :root {
    color-scheme: light dark;
    --fundo: #f6f4f1; --card: #ffffff; --borda: #e6e1da; --texto: #2a2522; --suave: #7a716a;
    --destaque: #7a1f2b; --destaque-claro: #f3e7e8;
    --verde: #2f6b2f; --verde-claro: #e6f1e1; --ambar: #8a5a0b; --ambar-claro: #faefd9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #17191c; --card: #202328; --borda: #30343a; --texto: #ecebe8; --suave: #9a9892;
      --destaque: #e0808c; --destaque-claro: #3a2428;
      --verde: #9fd39a; --verde-claro: #23331f; --ambar: #f0c070; --ambar-claro: #3a2f18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--borda); background: var(--card); color: var(--texto); padding: 6px 12px; }
  button:hover { border-color: var(--suave); }
  button:disabled { opacity: .5; cursor: default; }
  input { font: inherit; width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--borda); background: var(--card); color: var(--texto); }
  .principal { background: var(--destaque); color: #fff; border-color: var(--destaque); }
  @media (prefers-color-scheme: dark) { .principal { color: #17191c; } }

  #login { max-width: 360px; margin: 12vh auto; padding: 0 16px; }
  #login .card { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 24px; }
  #login h1 { font-size: 20px; margin: 0 0 4px; }
  #login p { color: var(--suave); margin: 0 0 18px; font-size: 14px; }
  #login label { display: block; font-size: 13px; color: var(--suave); margin: 10px 0 4px; }
  #login .principal { width: 100%; margin-top: 18px; padding: 10px; }
  .erro { color: #b3261e; font-size: 13px; margin-top: 10px; min-height: 18px; }

  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--borda); flex-wrap: wrap; }
  header .marca { font-weight: 600; color: var(--destaque); }
  nav { display: flex; gap: 4px; flex: 1; }
  nav button { border: none; background: none; padding: 6px 12px; color: var(--suave); }
  nav button.ativo { background: var(--destaque-claro); color: var(--destaque); font-weight: 600; }
  .quem { font-size: 13px; color: var(--suave); display: flex; gap: 10px; align-items: center; }

  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  main.largo { max-width: none; }

  /* funil */
  .quadro { display: grid; grid-auto-flow: column; grid-auto-columns: 210px; gap: 10px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
  .coluna { background: var(--card); border: 1px solid var(--borda); border-radius: 12px; padding: 10px; min-height: 160px; }
  .coluna h3 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; gap: 6px; }
  .coluna h3 .n { font-weight: 400; color: var(--suave); }
  .coluna .sub { font-size: 12px; color: var(--suave); margin: 2px 0 10px; min-height: 16px; }
  .coluna.azul { background: #eaf1fb; border-color: #c9dbf3; }
  .coluna.ambar { background: var(--ambar-claro); border-color: transparent; }
  .coluna.verde { background: var(--verde-claro); border-color: transparent; }
  .coluna.vermelho { background: #fbeaea; border-color: transparent; }
  @media (prefers-color-scheme: dark) {
    .coluna.azul { background: #1d2a3a; border-color: #2c3e55; }
    .coluna.vermelho { background: #3a2222; }
  }
  .cartao { background: var(--card); border: 1px solid var(--borda); border-radius: 10px; padding: 9px; margin-bottom: 8px; font-size: 13px; }
  .cartao .nome { font-size: 14px; }
  .cartao .meta, .cartao .tempo { font-size: 12px; }
  .cartao .selo { font-size: 10px; }
  .cartao .botoes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .cartao .botoes button { font-size: 12px; padding: 4px 8px; flex: 1 1 auto; }
  .cartao select { font: inherit; font-size: 12px; width: 100%; margin-top: 8px; padding: 5px; border-radius: 6px; border: 1px solid var(--borda); background: var(--card); color: var(--texto); }
  .cartao label { display: flex; gap: 6px; align-items: center; font-size: 12px; margin-top: 8px; }
  .motivo { font-size: 12px; margin-top: 4px; padding: 3px 6px; border-radius: 6px; background: var(--fundo); color: var(--suave); }
  .busca { max-width: 260px; }

  /* painel */
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .num { background: var(--card); border: 1px solid var(--borda); border-radius: 12px; padding: 12px 14px; }
  .num .rot { font-size: 13px; color: var(--suave); }
  .num .val { font-size: 24px; font-weight: 600; margin-top: 2px; }
  .num .det { font-size: 12px; color: var(--suave); }
  .num.destaque { border-color: var(--destaque); }
  .secao-painel { font-size: 15px; font-weight: 600; margin: 22px 0 10px; }
  .barra-linha { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--borda); }
  .barra-linha:first-child { border-top: none; }
  .barra-linha .txt { width: 300px; flex-shrink: 0; }
  .barra-linha .trilho { flex: 1; }
  .barra-linha .barra { height: 10px; border-radius: 5px; background: var(--destaque); }
  .barra-linha .qtd { width: 32px; text-align: right; font-weight: 600; }
  @media (max-width: 640px) { .barra-linha .txt { width: 150px; } }
  .topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .topo h2 { margin: 0; font-size: 20px; }
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; }
  .filtros button { white-space: nowrap; }
  .filtros button.ativo { background: var(--destaque-claro); border-color: var(--destaque); color: var(--destaque); }
  .lista { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; }
  .item { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--borda); }
  .item:first-child { border-top: none; }
  .av { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0; }
  .av.novo { background: var(--verde-claro); color: var(--verde); }
  .av.hist { background: var(--ambar-claro); color: var(--ambar); }
  .info { flex: 1; min-width: 0; }
  .nome { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .selo { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
  .selo.novo { background: var(--verde-claro); color: var(--verde); }
  .selo.hist { background: var(--ambar-claro); color: var(--ambar); }
  .selo.site { background: var(--destaque-claro); color: var(--destaque); }
  .selo.quem { background: var(--fundo); color: var(--suave); border: 1px solid var(--borda); }
  #atendente { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--borda); background: var(--card); color: var(--texto); }
  .tempo { font-size: 13px; margin-top: 2px; }
  .tempo.ok { color: var(--verde); }
  .tempo.esperando { color: #b3261e; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .tempo.esperando { color: #f2a19a; } }
  .meta { font-size: 13px; color: var(--suave); }
  .meta a { color: var(--suave); }
  .msg { font-size: 14px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .acoes { display: flex; gap: 6px; flex-shrink: 0; }
  .vazio { padding: 40px 16px; text-align: center; color: var(--suave); }
  .embreve { background: var(--card); border: 1px dashed var(--borda); border-radius: 14px; padding: 40px; text-align: center; color: var(--suave); }
  .aviso { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--texto); color: var(--fundo); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .aviso.on { opacity: 1; }
  @media (max-width: 640px) {
    .item { flex-wrap: wrap; }
    .acoes { width: 100%; }
    .acoes button { flex: 1; }
  }
</style>
</head>
<body>

<div id="login" hidden>
  <div class="card">
    <h1>CRM Aluguel</h1>
    <p>Projetar Imóveis</p>
    <form id="form-login">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button class="principal" type="submit">Entrar</button>
      <div class="erro" id="erro-login"></div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <span class="marca">CRM Aluguel</span>
    <nav id="abas">
      <button data-aba="entrada" class="ativo">Entrada</button>
      <button data-aba="funil">Funil</button>
      <button data-aba="painel" data-admin hidden>Painel</button>
    </nav>
    <span class="quem">
      <select id="atendente" data-admin hidden aria-label="Atendente">
        <option value="">Todas as atendentes</option>
      </select>
      <span id="quem"></span><button id="sair">Sair</button>
    </span>
  </header>

  <main>
    <section id="aba-entrada">
      <div class="topo">
        <h2>Entrada <span class="meta" id="contagem"></span></h2>
        <div class="filtros" id="filtros">
          <button data-f="todos" class="ativo">Todos</button>
          <button data-f="novos">Novos</button>
          <button data-f="hist">Com histórico</button>
          <button data-f="site">Cadastro no site</button>
        </div>
      </div>
      <div class="lista" id="lista"><div class="vazio">Carregando…</div></div>
    </section>

    <section id="aba-funil" hidden>
      <div class="topo">
        <h2>Funil de aluguel <span class="meta" id="contagem-funil"></span></h2>
        <input class="busca" id="busca-funil" type="search" placeholder="Buscar nome ou telefone">
      </div>
      <div class="quadro" id="quadro"><div class="vazio">Carregando…</div></div>
      <p class="meta">Realizado, perdido, reprovado e descartado mostram os últimos 30 dias.</p>
    </section>

    <section id="aba-painel" hidden>
      <div class="topo">
        <h2>Painel</h2>
        <div class="filtros" id="periodos">
          <button data-p="hoje" class="ativo">Hoje</button>
          <button data-p="ontem">Ontem</button>
          <button data-p="7d">7 dias</button>
          <button data-p="mes">Este mês</button>
          <button data-p="30d">30 dias</button>
        </div>
      </div>
      <div id="painel"><div class="vazio">Carregando…</div></div>
    </section>
  </main>
</div>

<div class="aviso" id="aviso"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://jgdbnkwhmesgjvsymgma.supabase.co";
const SUPABASE_KEY = "sb_publishable_qvAy43WiHGUyk0aitpg_WQ_2xYfKEKu";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// WhatsApp (instância da Evolution) de cada atendente — manter igual ao ATENDENTES da função crm-aluguel-entrada
const ATENDENTES = { ALUGUELARA: "Thainara", central: "Milene" };

let usuario = null;      // { nome, papel }
let filtroAtendente = ""; // admin: "" = todas
let contatos = [];
let filtro = "todos";
let timer = null;

const $ = (id) => document.getElementById(id);

function aviso(texto) {
  const a = $("aviso");
  a.textContent = texto;
  a.classList.add("on");
  setTimeout(() => a.classList.remove("on"), 2500);
}

function esc(t) {
  return String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function iniciais(nome, tel) {
  if (!nome) return tel.slice(-2);
  return nome.trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
}

function telefoneBonito(t) {
  const d = String(t).replace(/\D/g, "");
  const m = d.match(/^55(\d{2})(\d{4,5})(\d{4})$/);
  return m ? `(${m[1]}) ${m[2]}-${m[3]}` : "+" + d;
}

function quando(iso) {
  const d = new Date(iso);
  const min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return "agora";
  if (min < 60) return `há ${min} min`;
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const hora = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  if (d >= hoje) return `hoje ${hora}`;
  const ontem = new Date(hoje); ontem.setDate(ontem.getDate() - 1);
  if (d >= ontem) return `ontem ${hora}`;
  return d.toLocaleDateString("pt-BR") + " " + hora;
}

// Quando o admin vê todas, cada cartão mostra de quem é o cliente.
function seloAtendente(c) {
  return usuario?.papel === "admin" && !filtroAtendente
    ? `<span class="selo quem">${esc(ATENDENTES[c.instancia] ?? c.instancia)}</span>` : "";
}

function comAtendente(q) {
  return filtroAtendente ? q.eq("instancia", filtroAtendente) : q;
}

function duracao(min) {
  min = Math.max(0, Math.round(min));
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  if (h < 24) return m ? `${h}h ${m}min` : `${h}h`;
  const d = Math.floor(h / 24);
  return `${d} dia${d > 1 ? "s" : ""} ${h % 24}h`;
}

// Tempo de primeira resposta da atendente (ou quanto o cliente já está esperando).
function linhaTempo(c) {
  if (c.primeira_resposta_min != null) {
    const exp = c.primeira_resposta_min_expediente;
    const extra = exp != null && c.primeira_resposta_min - exp >= 30 ? ` (${duracao(exp)} em horário comercial)` : "";
    return `<div class="tempo ok">1ª resposta: ${duracao(c.primeira_resposta_min)}${extra}</div>`;
  }
  if (c.cliente_falou_em) {
    return `<div class="tempo esperando">Aguardando 1ª resposta há ${duracao((Date.now() - new Date(c.cliente_falou_em)) / 60000)}</div>`;
  }
  return "";
}

// ---------- login ----------

async function entrar(sessao) {
  if (!sessao) { $("login").hidden = false; $("app").hidden = true; return; }
  const { data, error } = await db.from("crm_aluguel_usuarios").select("nome, papel").eq("user_id", sessao.user.id).maybeSingle();
  if (error || !data) {
    await db.auth.signOut();
    $("erro-login").textContent = "Este login não tem acesso ao CRM de aluguel. Fale com o Marco.";
    $("login").hidden = false; $("app").hidden = true;
    return;
  }
  usuario = data;
  $("quem").textContent = `${data.nome} · ${data.papel === "admin" ? "administrador" : "atendente"}`;
  document.querySelectorAll("[data-admin]").forEach((el) => (el.hidden = data.papel !== "admin"));
  $("atendente").innerHTML = '<option value="">Todas as atendentes</option>' +
    Object.entries(ATENDENTES).map(([inst, nome]) => `<option value="${inst}">${nome}</option>`).join("");
  $("login").hidden = true; $("app").hidden = false;
  carregar();
  clearInterval(timer);
  timer = setInterval(() => { carregar(); if (!$("aba-funil").hidden && !abertoEm) carregarFunil(); }, 20000);
}

$("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("erro-login").textContent = "";
  const { data, error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("senha").value });
  if (error) { $("erro-login").textContent = "E-mail ou senha incorretos."; return; }
  entrar(data.session);
});

$("atendente").addEventListener("change", (e) => {
  filtroAtendente = e.target.value;
  carregar();
  if (!$("aba-funil").hidden) carregarFunil();
  if (!$("aba-painel").hidden) carregarPainel();
});

$("sair").addEventListener("click", async () => {
  clearInterval(timer);
  await db.auth.signOut();
  usuario = null;
  $("login").hidden = false; $("app").hidden = true;
});

// ---------- abas ----------

$("abas").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-aba]");
  if (!b) return;
  if (b.dataset.aba === "painel" && usuario?.papel !== "admin") return;
  document.querySelectorAll("#abas button").forEach((x) => x.classList.toggle("ativo", x === b));
  ["entrada", "funil", "painel"].forEach((a) => ($("aba-" + a).hidden = a !== b.dataset.aba));
  document.querySelector("main").classList.toggle("largo", b.dataset.aba === "funil");
  if (b.dataset.aba === "funil") carregarFunil();
  if (b.dataset.aba === "painel") carregarPainel();
});

// ---------- entrada ----------

async function carregar() {
  const { data, error } = await comAtendente(db.from("crm_aluguel_contatos")
    .select("id, instancia, telefone, nome, primeira_mensagem, primeira_mensagem_em, ultima_mensagem, ultima_mensagem_em, tem_historico, historico_detalhe, ultima_conversa_anterior, origem, imovel_link, cliente_falou_em, primeira_resposta_min, primeira_resposta_min_expediente")
    .is("classificacao", null))
    .order("primeira_mensagem_em", { ascending: false })
    .limit(300);
  if (error) { $("lista").innerHTML = `<div class="vazio">Não consegui carregar: ${esc(error.message)}</div>`; return; }
  contatos = data;
  desenhar();
}

function desenhar() {
  const visiveis = contatos.filter((c) =>
    filtro === "todos" ||
    (filtro === "novos" && !c.tem_historico) ||
    (filtro === "hist" && c.tem_historico) ||
    (filtro === "site" && c.origem === "cadastro_site"));
  const novos = contatos.filter((c) => !c.tem_historico).length;
  $("contagem").textContent = contatos.length ? `· ${contatos.length} aguardando (${novos} novos)` : "";
  if (!visiveis.length) {
    $("lista").innerHTML = `<div class="vazio">${contatos.length ? "Nenhum contato neste filtro." : "Nenhum cliente esperando análise."}</div>`;
    return;
  }
  $("lista").innerHTML = visiveis.map((c) => {
    const tipo = c.tem_historico ? "hist" : "novo";
    const selo = c.tem_historico ? "Cliente já com histórico" : "Novo";
    const detalhe = c.tem_historico
      ? ` · ${esc(c.historico_detalhe ?? "")}${c.ultima_conversa_anterior ? ` · última conversa ${new Date(c.ultima_conversa_anterior).toLocaleDateString("pt-BR")}` : ""}`
      : "";
    const site = c.origem === "cadastro_site";
    const msg = c.ultima_mensagem || (site ? "Mensagem automática enviada · cliente ainda não respondeu" : c.primeira_mensagem);
    const imovel = c.imovel_link ? ` · <a href="${esc(c.imovel_link)}" target="_blank" rel="noopener">ver imóvel</a>` : "";
    return `<div class="item" data-id="${c.id}">
      <div class="av ${tipo}">${esc(iniciais(c.nome, c.telefone))}</div>
      <div class="info">
        <div class="nome">${esc(c.nome ?? telefoneBonito(c.telefone))}<span class="selo ${tipo}">${selo}</span>${seloAtendente(c)}${site ? '<span class="selo site">Cadastro no site</span>' : ""}</div>
        <div class="meta"><a href="https://wa.me/${esc(c.telefone)}" target="_blank" rel="noopener">${telefoneBonito(c.telefone)}</a> · ${site ? "cadastrou" : "chegou"} ${quando(c.primeira_mensagem_em)}${imovel}${detalhe}</div>
        <div class="msg" title="${esc(msg)}">"${esc(msg)}"</div>
        ${linhaTempo(c)}
      </div>
      <div class="acoes">
        <button data-c="aluguel">Aluguel</button>
        <button data-c="vendas">Vendas</button>
        <button data-c="outros">Outros</button>
        <button data-c="suporte">Suporte</button>
      </div>
    </div>`;
  }).join("");
}

$("filtros").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-f]");
  if (!b) return;
  filtro = b.dataset.f;
  document.querySelectorAll("#filtros button").forEach((x) => x.classList.toggle("ativo", x === b));
  desenhar();
});

$("lista").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-c]");
  if (!b) return;
  const item = b.closest(".item");
  item.querySelectorAll("button").forEach((x) => (x.disabled = true));
  const { error } = await db.rpc("crm_aluguel_classificar", { p_contato: item.dataset.id, p_classe: b.dataset.c });
  if (error) {
    aviso("Não deu certo: " + error.message);
    item.querySelectorAll("button").forEach((x) => (x.disabled = false));
    return;
  }
  const nomes = { aluguel: "o funil de aluguel", vendas: "Vendas", outros: "Outros", suporte: "Suporte" };
  aviso(`Enviado para ${nomes[b.dataset.c]}`);
  contatos = contatos.filter((c) => c.id !== item.dataset.id);
  desenhar();
});

// ---------- painel (só administrador) ----------

let periodo = "hoje";

// Início do dia em Brasília (UTC-3), em ISO
function inicioDiaBR(deslocDias = 0) {
  const agora = new Date(Date.now() - 3 * 3600000);
  const d = Date.UTC(agora.getUTCFullYear(), agora.getUTCMonth(), agora.getUTCDate() + deslocDias, 3);
  return new Date(d);
}

function janela(p) {
  const amanha = inicioDiaBR(1);
  if (p === "hoje") return [inicioDiaBR(0), amanha];
  if (p === "ontem") return [inicioDiaBR(-1), inicioDiaBR(0)];
  if (p === "7d") return [inicioDiaBR(-6), amanha];
  if (p === "30d") return [inicioDiaBR(-29), amanha];
  const agora = new Date(Date.now() - 3 * 3600000);
  return [new Date(Date.UTC(agora.getUTCFullYear(), agora.getUTCMonth(), 1, 3)), amanha];
}

function pct(a, b) { return b ? Math.round((a / b) * 100) + "%" : "–"; }

function caixa(rot, val, det = "", destaque = false) {
  return `<div class="num${destaque ? " destaque" : ""}"><div class="rot">${rot}</div><div class="val">${val}</div>${det ? `<div class="det">${det}</div>` : ""}</div>`;
}

async function carregarPainel() {
  if (usuario?.papel !== "admin") return;
  const [ini, fim] = janela(periodo);
  const { data: d, error } = await db.rpc("crm_aluguel_painel", { p_inicio: ini.toISOString(), p_fim: fim.toISOString(), p_instancia: filtroAtendente || null });
  if (error) { $("painel").innerHTML = `<div class="vazio">Não consegui carregar: ${esc(error.message)}</div>`; return; }

  const et = d.agora.etapas, mv = d.movimento, en = d.entrada, rs = d.resposta, fe = d.fechamento;
  const cl = en.classificados;
  const n = (o, k) => o[k] ?? 0;
  const visitasMarcadas = n(mv, "visita");
  const realizadas = n(mv, "visita_realizada"), faltas = n(mv, "visita_nao_realizada");
  const fichas = n(mv, "ficha"), aprov = n(mv, "aprovado"), reprov = n(mv, "reprovado");
  const foiAluguel = n(cl, "atendimento");

  let h = `<div class="secao-painel">Como está agora</div><div class="grade">
    ${caixa("Na Entrada", d.agora.entrada, "esperando classificação")}
    ${caixa("1. Atendimento", n(et, "atendimento"))}
    ${caixa("2. Visita agendada", n(et, "visita"))}
    ${caixa("2.1 Visitou", n(et, "visita_realizada"))}
    ${caixa("2.2 Faltou", n(et, "visita_nao_realizada"))}
    ${caixa("3. Ficha em análise", n(et, "ficha"))}
    ${caixa("3.1 Aprovado", n(et, "aprovado"), "aguardando fechar")}
  </div>`;

  h += `<div class="secao-painel">Entrada no período</div><div class="grade">
    ${caixa("Novos contatos", en.novos_contatos, `${en.sem_historico} novos · ${en.com_historico} com histórico`)}
    ${caixa("Cadastro no site", en.cadastro_site)}
    ${caixa("Foram para aluguel", foiAluguel)}
    ${caixa("Vendas", n(cl, "vendas"))}
    ${caixa("Suporte", n(cl, "suporte"))}
    ${caixa("Outros", n(cl, "outros"))}
  </div>`;

  h += `<div class="secao-painel">Primeira resposta ${filtroAtendente ? "da " + esc(ATENDENTES[filtroAtendente]) : "das atendentes"}</div><div class="grade">
    ${caixa("Média em horário comercial", rs.media_expediente != null ? duracao(rs.media_expediente) : "–", `corrido: ${rs.media_min != null ? duracao(rs.media_min) : "–"}`, true)}
    ${caixa("Respondidos em até 5 min", pct(rs.ate_5min, rs.respondidos), `${rs.ate_5min} de ${rs.respondidos}`)}
    ${caixa("Clientes que falaram", rs.clientes)}
    ${caixa("Ainda sem resposta", rs.aguardando)}
  </div>`;

  h += `<div class="secao-painel">Movimento do funil no período</div><div class="grade">
    ${caixa("Visitas marcadas", visitasMarcadas)}
    ${caixa("Visitas realizadas", realizadas)}
    ${caixa("Faltaram", faltas)}
    ${caixa("Fichas enviadas", fichas, d.sem_visita ? `${d.sem_visita} sem visita` : "")}
    ${caixa("Aprovadas", aprov)}
    ${caixa("Reprovadas", reprov)}
    ${caixa("Realizados", n(mv, "realizado"))}
    ${caixa("Perdidos", n(mv, "perdido"))}
    ${caixa("Descartados", n(mv, "descartado"))}
  </div>`;

  h += `<div class="secao-painel">Taxas e tempo até fechar</div><div class="grade">
    ${caixa("Lead vira visita", pct(visitasMarcadas, foiAluguel))}
    ${caixa("Comparecimento", pct(realizadas, realizadas + faltas))}
    ${caixa("Visita vira ficha", pct(fichas, realizadas))}
    ${caixa("Aprovação", pct(aprov, aprov + reprov))}
    ${caixa("Lead vira contrato", pct(n(mv, "realizado"), foiAluguel))}
    ${caixa("Tempo até fechar", fe.media_dias != null ? `${String(fe.media_dias).replace(".", ",")} dias` : "–", `média de ${fe.realizados} contrato${fe.realizados === 1 ? "" : "s"}`, true)}
  </div>`;

  const maior = Math.max(1, ...d.perdas.map((p) => p.n));
  h += `<div class="secao-painel">Por que perdemos · motivo e etapa onde parou</div><div class="lista" style="padding:4px 14px">${
    d.perdas.length ? d.perdas.map((p) => `<div class="barra-linha">
      <span class="txt">${esc(MOTIVOS[p.motivo] ?? p.motivo)} · ${esc(NOME_ETAPA[p.etapa] ?? p.etapa)}</span>
      <span class="trilho"><div class="barra" style="width:${Math.round((p.n / maior) * 100)}%"></div></span>
      <span class="qtd">${p.n}</span></div>`).join("")
    : '<div class="vazio" style="padding:16px">Nenhuma perda no período.</div>'}</div>
    <p class="meta">Taxas comparam o que aconteceu dentro do período escolhido. Horário comercial: seg a sex 8h–12h e 13h30–18h, sáb 8h–12h.</p>`;

  $("painel").innerHTML = h;
}

$("periodos").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-p]");
  if (!b) return;
  periodo = b.dataset.p;
  document.querySelectorAll("#periodos button").forEach((x) => x.classList.toggle("ativo", x === b));
  carregarPainel();
});

// ---------- funil ----------

const COLUNAS = [
  { id: "atendimento",          num: "1",   nome: "Atendimento" },
  { id: "visita",               num: "2",   nome: "Visita",           sub: "Agendada" },
  { id: "visita_realizada",     num: "2.1", nome: "Visita realizada", sub: "Cliente foi", cor: "azul" },
  { id: "visita_nao_realizada", num: "2.2", nome: "Não realizada",    sub: "Cliente faltou", cor: "ambar" },
  { id: "ficha",                num: "3",   nome: "Ficha cadastral",  sub: "Em análise" },
  { id: "aprovado",             num: "3.1", nome: "Aprovado",         sub: "Ficha aprovada", cor: "azul" },
  { id: "reprovado",            num: "3.2", nome: "Reprovado",        sub: "Sem condições de alugar", cor: "ambar" },
  { id: "realizado",            num: "4.1", nome: "Realizado",        sub: "Fechou com a Projetar", cor: "verde" },
  { id: "perdido",              num: "4.2", nome: "Perdido",          sub: "Aprovado, mas não fechou", cor: "vermelho" },
  { id: "descartado",           num: "5",   nome: "Descartado",       sub: "Desistiu antes da ficha", cor: "vermelho" },
];

const MOTIVOS = {
  alugou_outra_imobiliaria: "Alugou com outra imobiliária",
  alugou_direto: "Alugou direto com o proprietário",
  desistiu_de_locar: "Desistiu de locar",
  nao_responde: "Não responde mais as mensagens",
  reprovado: "Reprovado",
};

const NOME_ETAPA = Object.fromEntries(COLUNAS.map((c) => [c.id, c.nome.toLowerCase()]));

// botões de cada etapa: [texto, destino, tipo]  tipo: motivo | semvisita | confirmar
const ACOES = {
  atendimento:          [["Marcar visita", "visita"], ["Ficha sem visita", "ficha", "semvisita"], ["Descartar", "descartado", "motivo"]],
  visita:               [["Realizada", "visita_realizada"], ["Não foi", "visita_nao_realizada"]],
  visita_realizada:     [["Enviar ficha", "ficha"], ["Descartar", "descartado", "motivo"]],
  visita_nao_realizada: [["Reagendar", "visita"], ["Ficha sem visita", "ficha", "semvisita"], ["Descartar", "descartado", "motivo"]],
  ficha:                [["Aprovar", "aprovado"], ["Reprovar", "reprovado", "confirmar"]],
  aprovado:             [["Realizado", "realizado", "confirmar"], ["Perdido", "perdido", "motivo"]],
  reprovado:  [["Reabrir", "atendimento", "confirmar"]],
  realizado:  [["Reabrir", "atendimento", "confirmar"]],
  perdido:    [["Reabrir", "atendimento", "confirmar"]],
  descartado: [["Reabrir", "atendimento", "confirmar"]],
};

let funil = [];
let abertoEm = null;   // { id, para, tipo } enquanto um cartão pede motivo / confirmação

async function carregarFunil() {
  const desde = new Date(Date.now() - 30 * 86400000).toISOString();
  const { data, error } = await comAtendente(db.from("crm_aluguel_contatos")
    .select("id, instancia, telefone, nome, origem, imovel_link, tem_historico, etapa, etapa_em, motivo, etapa_da_perda, sem_visita, entrou_funil_em, fechado_em, primeira_resposta_min, primeira_resposta_min_expediente, cliente_falou_em, ultima_mensagem")
    .eq("classificacao", "aluguel"))
    .or(`fechado_em.is.null,fechado_em.gte.${desde}`)
    .order("etapa_em", { ascending: true })
    .limit(1000);
  if (error) { $("quadro").innerHTML = `<div class="vazio">Não consegui carregar: ${esc(error.message)}</div>`; return; }
  funil = data;
  desenharFunil();
}

function cartaoFunil(c) {
  const dias = (Date.now() - new Date(c.etapa_em)) / 60000;
  let h = `<div class="cartao" data-id="${c.id}">
    <div class="nome">${esc(c.nome ?? telefoneBonito(c.telefone))}</div>
    <div>${seloAtendente(c)}${c.origem === "cadastro_site" ? '<span class="selo site">Cadastro no site</span> ' : ""}${c.tem_historico ? '<span class="selo hist">Com histórico</span> ' : ""}${c.sem_visita ? '<span class="selo hist">Não quis visitar</span>' : ""}</div>
    <div class="meta"><a href="https://wa.me/${esc(c.telefone)}" target="_blank" rel="noopener">${telefoneBonito(c.telefone)}</a>${c.imovel_link ? ` · <a href="${esc(c.imovel_link)}" target="_blank" rel="noopener">imóvel</a>` : ""}</div>
    <div class="meta">${c.fechado_em ? "nesta etapa desde " + new Date(c.etapa_em).toLocaleDateString("pt-BR") : "há " + duracao(dias) + " nesta etapa"}</div>`;
  if (c.etapa === "realizado" && c.entrou_funil_em) {
    h += `<div class="tempo ok">Fechou em ${duracao((new Date(c.fechado_em) - new Date(c.entrou_funil_em)) / 60000)}</div>`;
  } else if (!c.fechado_em) {
    h += linhaTempo(c);
  }
  if (c.motivo) h += `<div class="motivo">${esc(MOTIVOS[c.motivo] ?? c.motivo)}${c.etapa_da_perda ? " · " + esc(NOME_ETAPA[c.etapa_da_perda] ?? c.etapa_da_perda) : ""}</div>`;

  if (abertoEm && abertoEm.id === c.id) {
    if (abertoEm.tipo === "motivo") {
      const lista = Object.entries(MOTIVOS).filter(([k]) => k !== "reprovado");
      h += `<select data-motivo><option value="">Escolha o motivo</option>${lista.map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>`;
    } else if (abertoEm.tipo === "semvisita") {
      h += `<label><input type="checkbox" data-semvisita> Cliente não quis visitar</label>`;
    } else {
      h += `<div class="meta" style="margin-top:8px">Confirmar: ${esc(abertoEm.texto)}?</div>`;
    }
    h += `<div class="botoes"><button class="principal" data-ok>Confirmar</button><button data-cancelar>Cancelar</button></div>`;
  } else {
    h += `<div class="botoes">${(ACOES[c.etapa] ?? []).map(([t, para, tipo]) =>
      `<button data-para="${para}" data-tipo="${tipo ?? ""}" data-texto="${esc(t)}">${t}</button>`).join("")}</div>`;
  }
  return h + "</div>";
}

function desenharFunil() {
  const termo = $("busca-funil").value.trim().toLowerCase();
  const so = termo.replace(/\D/g, "");
  const lista = funil.filter((c) => !termo || (c.nome ?? "").toLowerCase().includes(termo) || (so && c.telefone.includes(so)));
  const abertos = funil.filter((c) => !c.fechado_em).length;
  $("contagem-funil").textContent = `· ${abertos} em andamento`;
  $("quadro").innerHTML = COLUNAS.map((col) => {
    const itens = lista.filter((c) => c.etapa === col.id);
    return `<div class="coluna ${col.cor ?? ""}">
      <h3>${col.num}. ${col.nome}<span class="n">${itens.length}</span></h3>
      <div class="sub">${col.sub ?? ""}</div>
      ${itens.map(cartaoFunil).join("")}
    </div>`;
  }).join("");
}

$("busca-funil").addEventListener("input", desenharFunil);

async function mover(id, para, motivo, semVisita) {
  const { error } = await db.rpc("crm_aluguel_mover", { p_contato: id, p_para: para, p_motivo: motivo ?? null, p_sem_visita: !!semVisita });
  if (error) { aviso(error.message); return false; }
  const col = COLUNAS.find((c) => c.id === para);
  aviso(`Movido para ${col.num}. ${col.nome}`);
  return true;
}

$("quadro").addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const cartao = b.closest(".cartao");
  const id = cartao.dataset.id;

  if (b.hasAttribute("data-cancelar")) { abertoEm = null; desenharFunil(); return; }

  if (b.hasAttribute("data-ok")) {
    let motivo = null, semVisita = false;
    if (abertoEm.tipo === "motivo") {
      motivo = cartao.querySelector("[data-motivo]").value;
      if (!motivo) { aviso("Escolha o motivo"); return; }
    }
    if (abertoEm.tipo === "semvisita") {
      semVisita = cartao.querySelector("[data-semvisita]").checked;
      if (!semVisita) { aviso('Marque "Cliente não quis visitar"'); return; }
    }
    b.disabled = true;
    const ok = await mover(id, abertoEm.para, motivo, semVisita);
    if (!ok) { b.disabled = false; return; }
    abertoEm = null;
    carregarFunil();
    return;
  }

  const para = b.dataset.para;
  if (!para) return;
  if (b.dataset.tipo) {
    abertoEm = { id, para, tipo: b.dataset.tipo, texto: b.dataset.texto };
    desenharFunil();
    return;
  }
  cartao.querySelectorAll("button").forEach((x) => (x.disabled = true));
  if (await mover(id, para)) carregarFunil();
  else cartao.querySelectorAll("button").forEach((x) => (x.disabled = false));
});

db.auth.getSession().then(({ data }) => entrar(data.session));
</script>
